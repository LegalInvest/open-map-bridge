name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify technical disclosure freshness
        run: npm run disclosure:check

      - name: Run unit and contract tests
        run: npm test

      - name: Type-check all workspaces
        run: npm run typecheck

      - name: Build production assets
        run: npm run build

      - name: Install Chrome for browser acceptance
        run: npx playwright install --with-deps chrome

      - name: Run public browser journeys
        run: npm run test:e2e
